name: modam-agi
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: modam
      POSTGRES_DB: modam
      POSTGRES_PASSWORD: ${MODAM_POSTGRES_PASSWORD:?Run scripts/start_postgres.py first}
    ports:
      - "127.0.0.1:${MODAM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modam -d modam"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
