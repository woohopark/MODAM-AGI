[project]
name = "modam-agi"
version = "0.3.0"
description = "Groq orchestration with authenticated persistent chat and independent MCP boundaries"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.30,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23,<26",
]

[project.scripts]
modam-api = "modam.chat.cli:api"
modam-worker = "modam.chat.worker:main"
modam-create-user = "modam.chat.cli:bootstrap"
modam-evaluate = "modam.evaluation:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modam"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/modam"]
