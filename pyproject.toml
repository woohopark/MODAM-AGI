[project]
name = "modam-agi"
version = "0.2.0"
description = "Groq-only orchestration foundation for independent MCP services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.30,<2",
]

[project.scripts]
modam-evaluate = "modam.evaluation:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modam"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/modam"]
